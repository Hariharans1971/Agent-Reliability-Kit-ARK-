<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">ARK agent reliability workflow</title>
<desc id="desc">Record an AI agent run as JSONL, inspect and compare traces, then enforce a policy in continuous integration.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14253b"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#48d6c8"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".22"/></filter>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<g opacity=".14" stroke="#7ba7d9" stroke-width="1"><path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/><path d="M60 0V360M120 0V360M180 0V360M240 0V360M300 0V360M360 0V360M420 0V360M480 0V360M540 0V360M600 0V360M660 0V360M720 0V360M780 0V360M840 0V360M900 0V360M960 0V360M1020 0V360M1080 0V360M1140 0V360"/></g>
<text x="54" y="54" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#76dcd4">ARK · POLICY-AS-CODE FOR AI AGENTS</text>
<text x="54" y="94" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f8ff">Make agent behavior testable before it ships.</text>
<text x="54" y="121" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b8c9de">Portable traces · deterministic checks · CI enforcement · no hosted service required</text>
<g filter="url(#shadow)">
  <rect x="54" y="166" width="226" height="126" rx="15" fill="#162a43" stroke="#385775"/>
  <rect x="334" y="166" width="226" height="126" rx="15" fill="#162a43" stroke="#385775"/>
  <rect x="614" y="166" width="226" height="126" rx="15" fill="#162a43" stroke="#385775"/>
  <rect x="894" y="166" width="252" height="126" rx="15" fill="#172f3d" stroke="#3d8c89"/>
</g>
<g font-family="Inter,Arial,sans-serif">
  <circle cx="83" cy="197" r="13" fill="#2f6fbd"/><text x="83" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="106" y="202" font-size="17" font-weight="700" fill="#f4f8ff">Record</text>
  <text x="76" y="235" font-size="14" fill="#b8c9de">Your agent or tools</text><text x="76" y="257" font-size="14" fill="#b8c9de">→ JSONL trace</text>
  <circle cx="363" cy="197" r="13" fill="#2f6fbd"/><text x="363" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="386" y="202" font-size="17" font-weight="700" fill="#f4f8ff">Inspect &amp; diff</text>
  <text x="356" y="235" font-size="14" fill="#b8c9de">Compare expected</text><text x="356" y="257" font-size="14" fill="#b8c9de">and actual behavior</text>
  <circle cx="643" cy="197" r="13" fill="#2f6fbd"/><text x="643" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="666" y="202" font-size="17" font-weight="700" fill="#f4f8ff">Evaluate policy</text>
  <text x="636" y="235" font-size="14" fill="#b8c9de">Allowed events, call</text><text x="636" y="257" font-size="14" fill="#b8c9de">limits and budgets</text>
  <circle cx="923" cy="197" r="13" fill="#1c9c91"/><text x="923" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
  <text x="946" y="202" font-size="17" font-weight="700" fill="#f4f8ff">Gate CI</text>
  <text x="916" y="235" font-size="14" fill="#c2e9e4">PASS · exit 0</text><text x="916" y="257" font-size="14" fill="#ffb9b9">FAIL · exit 1</text>
</g>
<g stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M286 229H325"/><path d="M317 221L325 229L317 237"/><path d="M566 229H605"/><path d="M597 221L605 229L597 237"/><path d="M846 229H885"/><path d="M877 221L885 229L877 237"/></g>
<text x="54" y="330" font-family="Inter,Arial,sans-serif" font-size="12" fill="#8ea6c2">Deterministic checks validate recorded behavior; they do not guarantee an agent is correct or safe.</text>
</svg>