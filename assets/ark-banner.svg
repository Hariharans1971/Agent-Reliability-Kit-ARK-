    <text x="190" y="79" fill="#99f6e4" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">OPEN-SOURCE DEVELOPER TOOL</text>
    <text x="72" y="150" fill="#f8fafc" font-size="48" font-weight="800" letter-spacing="-.9">Agent Reliability Kit</text>
    <text x="74" y="194" fill="#cbd5e1" font-size="22" font-weight="500">Policy-as-code guardrails for AI-agent workflows</text>
    <g>
