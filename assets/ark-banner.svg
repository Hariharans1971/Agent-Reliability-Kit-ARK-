<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent Reliability Kit</title>
  <desc id="desc">A deep navy technical banner with a cyan event trace flowing through verification checkpoints, representing policy-based CI guardrails for AI agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="54%" stop-color="#101e37"/>
      <stop offset="100%" stop-color="#123a45"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
