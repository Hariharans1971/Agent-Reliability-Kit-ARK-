    <circle cx="790" cy="256" r="3.5"/><circle cx="972" cy="298" r="3.5"/>
    <circle cx="1110" cy="126" r="3.5"/><circle cx="1130" cy="248" r="3.5"/>
    <circle cx="828" cy="176" r="3.5"/><circle cx="1134" cy="174" r="3.5"/>
