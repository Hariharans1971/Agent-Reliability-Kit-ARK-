  <rect x="10" y="10" width="300" height="300" rx="62" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <path d="M58 202 H108 L144 124 L182 182 L224 96 H262" fill="none" stroke="url(#line)" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/>
