name: Consumer action smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "pyproject.toml"
      - "ark/**"
      - "examples/**"
      - "policies/**"
      - ".github/workflows/consumer-smoke.yml"

permissions:
  contents: read

concurrency:
  group: consumer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-pass:
    name: Consumer workflow accepts a compliant trace
    runs-on: ubuntu-latest
    steps:
      - name: Check out the example consumer files
        uses: actions/checkout@v7
      - name: Prepare a synthetic agent trace
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install demo package and create trace
        run: |
          python -m pip install -e .
          python examples/customer_support_agent.py
      - name: Enforce the contract via the published action reference
        uses: Hariharans1971/Agent-Reliability-Kit-ARK-@3154b6fe02c9b089c8d76b2a972aaef8f2b05dc0
        with:
          trace: artifacts/customer-support.jsonl
          policy: policies/customer-support.json
          python-version: "3.12"
      - name: Write JUnit policy report
        run: ark policy artifacts/customer-support.jsonl --policy policies/customer-support.json --junit-xml artifacts/consumer-policy-results.xml

  policy-reject:
    name: Consumer workflow rejects an unapproved trace
    runs-on: ubuntu-latest
    steps:
      - name: Check out the example consumer files
        uses: actions/checkout@v7
      - name: Set up Python for fixture verification
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ARK to validate the negative fixture
        run: python -m pip install -e .
      - name: Verify the rejection fixture fails for the expected policy reason
        shell: bash
        run: |
          set +e
          output="$(ark policy examples/sample-trace.jsonl --policy policies/reject-sample.json 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "::error::Expected exit code 1 for a policy violation, got $status"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -Fq "unexpected event names"; then
            echo "::error::The fixture failed for a reason other than its event allowlist"
            exit 1
          fi
      - name: Invoke the published action on a deliberately restricted policy
        id: restricted
        continue-on-error: true
        uses: Hariharans1971/Agent-Reliability-Kit-ARK-@3154b6fe02c9b089c8d76b2a972aaef8f2b05dc0
        with:
          trace: examples/sample-trace.jsonl
          policy: policies/reject-sample.json
          python-version: "3.12"
      - name: Assert the action failed on the unapproved trace
        if: steps.restricted.outcome != 'failure'
        run: |
          echo "::error::Expected the public ARK action to reject the unapproved trace"
          exit 1
