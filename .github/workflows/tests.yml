name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI
        run: |
          ark inspect examples/sample-trace.jsonl
          ark evaluate examples/sample-trace.jsonl --min-steps 2
          ark diff examples/sample-trace.jsonl examples/sample-trace.jsonl
          python examples/customer_support_agent.py
          ark policy artifacts/customer-support.jsonl --policy policies/customer-support.json
          ark policy artifacts/customer-support.jsonl --policy policies/customer-support.json --junit-xml artifacts/ark-policy-results.xml
          ark evaluate examples/sample-trace.jsonl --min-steps 2 --junit-xml artifacts/ark-evaluation-results.xml
      - name: Verify the rejection fixture fails for the expected policy reason
        shell: bash
        run: |
          set +e
          output="$(ark policy examples/sample-trace.jsonl --policy policies/reject-sample.json 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "::error::Expected exit code 1 for a policy violation, got $status"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -Fq "unexpected event names"; then
            echo "::error::The fixture failed for a reason other than its event allowlist"
            exit 1
          fi
      - name: Confirm CLI rejects an unapproved trace
        id: reject-policy
        continue-on-error: true
        run: ark policy examples/sample-trace.jsonl --policy policies/reject-sample.json
      - name: Assert the deliberate policy rejection happened
        if: steps.reject-policy.outcome != 'failure'
        run: |
          echo "::error::Expected ARK to reject the deliberately unapproved sample trace"
          exit 1
      - name: Smoke-test composite GitHub Action
        uses: ./
        with:
          trace: artifacts/customer-support.jsonl
          policy: policies/customer-support.json
          python-version: ${{ matrix.python-version }}

  package-build:
    name: Build and install wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv .wheel-test
          . .wheel-test/bin/activate
          python -m pip install dist/*.whl
          ark --help
          python -c "import ark; print('Installed ARK package from wheel:', ark.__file__)"
