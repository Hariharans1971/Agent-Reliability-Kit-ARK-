name: Bug report
description: Report a reproducible bug in ARK.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please remove secrets and private customer data before sharing traces."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed failure.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run ... 2. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python and ARK versions
    validations:
      required: true
