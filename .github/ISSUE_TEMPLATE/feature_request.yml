name: Feature request
description: Suggest a feature or integration for ARK.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What recurring workflow or pain point does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed smallest useful version
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How should it be tested?
    validations:
      required: true
