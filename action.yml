name: "Agent Reliability Kit Policy Gate"
description: "Fail CI when an AI-agent trace violates a declarative JSON contract."
author: "Hariharan S."

inputs:
  trace:
    description: "Path to the JSONL trace, relative to the consuming repository."
    required: true
  policy:
    description: "Path to the ARK JSON policy file, relative to the consuming repository."
    required: true
  python-version:
    description: "Python version to use."
    required: false
    default: "3.12"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Agent Reliability Kit
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Enforce trace policy
      shell: bash
      env:
        ARK_TRACE: ${{ inputs.trace }}
        ARK_POLICY: ${{ inputs.policy }}
      run: ark policy "$ARK_TRACE" --policy "$ARK_POLICY"
