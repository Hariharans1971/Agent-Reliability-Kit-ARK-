[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-kit"
version = "0.1.0"
description = "Local-first tracing and regression checks for AI-agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Hariharan S."}]
keywords = ["ai-agents", "observability", "evaluation", "replay", "testing", "llm"]
dependencies = []

[project.scripts]
ark = "ark.cli:main"

[tool.setuptools.packages.find]
include = ["ark*"]
